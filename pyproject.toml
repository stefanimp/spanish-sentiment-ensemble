[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spanish-sentiment-ensemble"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Reproducible Spanish sentiment ensemble with a hierarchical cascade"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{name = "stefanimp"}]
dependencies = ["numpy==2.3.4"]

[project.urls]
Repository = "https://github.com/stefanimp/spanish-sentiment-ensemble"
Issues = "https://github.com/stefanimp/spanish-sentiment-ensemble/issues"

[project.optional-dependencies]
report = ["reportlab>=4.4,<5"]
dev = ["pytest>=8,<9", "ruff==0.17.1"]
train = ["torch>=2.11,<2.12", "transformers==4.57.1", "accelerate>=1,<2", "scikit-learn==1.8.0", "sentencepiece>=0.2,<0.3", "protobuf>=6,<8"]

[project.scripts]
spanish-sentiment = "sentiment_ensemble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
